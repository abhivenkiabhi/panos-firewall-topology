hostname FW-CORE-01
domain-name corp.internal

! --- Interface Configurations & Security Zones ---

interface GigabitEthernet0/0
 nameif OUTSIDE
 security-level 0
 ip address 203.0.113.1 255.255.255.0
 description Uplink to ISP1 / Public Internet
 no shutdown
!
interface GigabitEthernet0/1
 nameif DMZ
 security-level 50
 ip address 192.168.10.1 255.255.255.0
 description Public-facing Services (Web & API Proxies)
 no shutdown
!
interface GigabitEthernet0/2
 nameif INSIDE
 security-level 100
 ip address 10.100.1.1 255.255.255.0
 description Corporate Internal Trust & Application Network
 no shutdown
!
interface GigabitEthernet0/4
 nameif PCI_ZONE
 security-level 80
 ip address 10.200.50.1 255.255.255.0
 description PCI-DSS Cardholder Data Environment
 no shutdown
!
interface Management0/0
 nameif MANAGEMENT
 security-level 100
 ip address 10.254.1.1 255.255.255.0
 description Out-of-band Management Network
 no shutdown
!

! --- Object Definitions (Subnets & Hosts) ---

object network OBJ_NET_DMZ
 subnet 192.168.10.0 255.255.255.0
 description DMZ Web & App Servers Subnet
!
object network OBJ_NET_INSIDE
 subnet 10.100.1.0 255.255.255.0
 description Internal Corporate Subnet
!
object network OBJ_NET_PCI
 subnet 10.200.50.0 255.255.255.0
 description PCI Secure Processing Subnet
!
object network OBJ_HOST_WEB_SRV01
 host 192.168.10.80
 description Production NGINX Reverse Proxy
!
object network OBJ_HOST_APP_SRV01
 host 10.100.1.20
 description Internal Core Application Server
!
object network OBJ_HOST_DB_SRV01
 host 10.100.1.50
 description Internal PostgreSQL Database Server
!
object network OBJ_HOST_PAYMENT_GW
 host 10.200.50.25
 description PCI Tokenization & Payment API Gateway
!
object network OBJ_HOST_MGMT_BASTION
 host 10.254.1.10
 description Jump Host / Bastion for Operations
!

! --- NAT / PAT Rules ---

! Public 1:1 NAT mapping for Web Server
object network OBJ_HOST_WEB_SRV01
 nat (DMZ,OUTSIDE) static 203.0.113.80 service tcp 443 443
!
! Outbound PAT for Inside and PCI trust networks to Internet
nat (INSIDE,OUTSIDE) after-auto source dynamic OBJ_NET_INSIDE interface
nat (PCI_ZONE,OUTSIDE) after-auto source dynamic OBJ_NET_PCI interface
nat (DMZ,OUTSIDE) after-auto source dynamic OBJ_NET_DMZ interface
!

! --- Access Control Lists (ACLs) & Security Policies ---

! Outside Ingress Policy
access-list ACL_OUTSIDE_IN extended permit tcp any host 192.168.10.80 eq 443 rule-id 101 description Allow Inbound HTTPS to DMZ Web
access-list ACL_OUTSIDE_IN extended permit tcp any host 192.168.10.80 eq 80 rule-id 102 description Allow Inbound HTTP for Redirect
access-list ACL_OUTSIDE_IN extended permit icmp any any echo rule-id 103 description Allow Outside Ping
access-list ACL_OUTSIDE_IN extended deny ip any any rule-id 999 description Implicit Deny All Outside Ingress
!
access-group ACL_OUTSIDE_IN in interface OUTSIDE
!

! DMZ Ingress Policy (Updated in CR-4910)
access-list ACL_DMZ_IN extended permit tcp 192.168.10.0 255.255.255.0 host 10.100.1.20 eq 8080 rule-id 201 description Allow DMZ Web to App Server API
access-list ACL_DMZ_IN extended permit udp 192.168.10.0 255.255.255.0 any eq 53 rule-id 202 description Allow DMZ DNS Lookups
access-list ACL_DMZ_IN extended permit tcp 192.168.10.0 255.255.255.0 host 10.200.50.25 eq 443 rule-id 205 description Allow DMZ Web to Payment Gateway API
access-list ACL_DMZ_IN extended deny ip 192.168.10.0 255.255.255.0 host 10.100.1.50 rule-id 203 description Strict Deny DMZ direct to Database
access-list ACL_DMZ_IN extended deny ip any any rule-id 299 description Deny DMZ All Other
!
access-group ACL_DMZ_IN in interface DMZ
!

! Inside Ingress Policy
access-list ACL_INSIDE_IN extended permit ip 10.100.1.0 255.255.255.0 any rule-id 301 description Allow Inside Outbound All
access-list ACL_INSIDE_IN extended permit tcp host 10.100.1.20 host 10.100.1.50 eq 5432 rule-id 302 description Allow App to DB Postgres
access-list ACL_INSIDE_IN extended permit tcp host 10.100.1.20 host 10.200.50.25 eq 8443 rule-id 305 description Allow App Server to Payment Settlement API
access-group ACL_INSIDE_IN in interface INSIDE
!

! PCI Zone Ingress Policy (NEW in CR-4910)
access-list ACL_PCI_IN extended permit tcp host 10.200.50.25 host 10.100.1.50 eq 5432 rule-id 501 description Allow Payment GW to DB
access-list ACL_PCI_IN extended deny ip any any rule-id 599 description Deny All Other PCI Ingress
access-group ACL_PCI_IN in interface PCI_ZONE
!

! --- Routing Table (Static Routes & Default Gateways) ---

route OUTSIDE 0.0.0.0 0.0.0.0 203.0.113.254 1
route INSIDE 10.100.0.0 255.255.0.0 10.100.1.254 1
route DMZ 192.168.10.0 255.255.255.0 192.168.10.1 1
route PCI_ZONE 10.200.50.0 255.255.255.0 10.200.50.1 1
!

